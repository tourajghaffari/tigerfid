# CI — the close-protocol lint, behind the docs-only fast path, with the
# tick-merge-claim arm and the secret-scan backstop on every PR. TWO required
# checks, `scope` and `test` (KB ci-gating-standard) — extend `test`, never
# rename it (KB required-status-check-rename). `test` grows as the rebuild
# brings checks to run: the reference-check tests (plan Story 1.1.3), the
# licence gate (Story 1.1.4), then KiCad ERC/DRC, firmware builds and
# software tests as they come to exist.
#
# Runners (hub spec 2026-10-26-tigerfid-onboarding-design, C2): every job runs
# on GitHub-hosted ubuntu-latest, never the fleet's self-hosted runner
# variable. This repo is public; the fleet's self-hosted runner group refuses
# public repos and must keep refusing — opening it would let any fork's pull
# request run code on the fleet's own machines. Hosted minutes are free for
# public repos.
#
# Checkouts (spec C3): full history (`fetch-depth: 0`) so the fast path and
# close-lint can resolve their merge-base reads, but blobless
# (`filter: blob:none`), so a run downloads only the blobs of the tree it
# checks out — never the 2018 history's, which lives at the tag
# activewave-2018.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded-run cancellation (hub Story 19.1.2): rapid pushes to one PR stop
# paying for obsolete runs. Keyed by PR number; non-PR events fall back to the
# unique run_id so every push-to-main run gets a group of one — post-merge runs
# are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Least-privilege token: the pipeline only reads the repo. Actions are pinned
# to immutable commit SHAs (tag comments for readability); Dependabot's
# github-actions ecosystem keeps the pins current.
permissions:
  contents: read

jobs:
  # Docs-only fast path (hub Story 19.1.3). Decides whether this change set is
  # documentation only; `test` skips when it says yes. Fail-closed — any
  # uncertainty reports false and buys the full run. Deliberately NOT a `paths:`
  # filter: a filtered-out workflow never reports, so required contexts would
  # block every docs PR forever (KB ci-gating-standard). This job reports, so it
  # is itself a required context (rule 1).
  scope:
    # GitHub-hosted on purpose — spec C2, above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the fast path diffs the merge ref against its first
          # parent — the PR's own commits, never main's advance (hub Story
          # 98.1.1). Blobless (spec C3).
          fetch-depth: 0
          filter: blob:none
      # The fleet Node pin here too: the scope scripts are hub-synced
      # canonicals written against Node 24, and a GitHub-hosted image's
      # default Node is not the fleet's choice.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: scope
        run: node scripts/ci-docs-only.mjs
      # Tick-merge-claim arm (hub Story 206.1.1; wired fleet-wide by hub Story
      # 215.1.3): a tick that rides its own PR cannot claim its merge.
      - run: node scripts/check-tick-merge-claim.mjs
      # Secret-scan backstop (hub Story 26.1.2; fleet-wide by hub Story
      # 225.1.2): re-scans ALL tracked file contents, so a credential committed
      # from a clone without core.hooksPath cannot reach main behind green
      # checks. Here, in scope, because this job runs on every PR, docs-only
      # ones included. A hub-synced canonical: a change the scan needs goes to
      # the hub, never into this copy. Dependency-free.
      - run: node scripts/block-secrets.mjs --repo-scan

  test:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # GitHub-hosted on purpose — spec C2, above.
    runs-on: ubuntu-latest
    # Sized per KB browser-ci-lane-job-timeout: never under 5; re-size from the
    # first twenty runs (hub Initiative 84).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so close-lint's manifest-lockstep check can resolve
          # merge-base(origin/main, HEAD) on PR merge refs; a shallow checkout
          # makes lockstep skip (loudly, but unenforced). Blobless (spec C3).
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Fleet Node pin: 24 (the fleet-wide ruling of 2026-08-10). Retune
          # jointly with package.json's engines field. No npm install: the
          # repo has no dependencies (add `npm ci` and `npm audit signatures`
          # in the same PR as the first one).
          node-version: 24
      - name: Close-protocol lint
        run: node scripts/close-lint.mjs
      # The reference-corpus check's own tests (plan Story 1.1.3). Each case
      # builds a throwaway repo and folder, so CI never needs the corpus.
      - name: Reference-check tests
        run: node --test scripts/reference-check.test.mjs
